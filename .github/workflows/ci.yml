name: Node.js CI Robot

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Get the code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x' 

    # 5. The Build Check: Do the pieces fit together?
    - name: Install the packages
      working-directory: ./chargeUp-backend  # ⚠️ CHANGE 'backend' TO YOUR EXACT FOLDER NAME!
      run: npm install
